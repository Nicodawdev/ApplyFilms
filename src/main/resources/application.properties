# Selección de perfil (default) inicializar app
spring.profiles.active=dev

# Nombre de nuestra aplicación
spring.application.name= Apply Films 

# Configuración del Puerto
server.port=8090
# Context Path
server.servlet.context-path=/applyfilms/api

#PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Leemos la clave de OpenAI desde una variable de entorno
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
# Modelo de OpenAI que generará las respuestas.
langchain4j.open-ai.chat-model.model-name=gpt-6-luna