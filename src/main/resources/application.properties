# Fichero maestro: seleccion del perfil activo (dev, test o prod)
spring.profiles.active=dev

spring.application.name=ApplyFilms
server.port=8080

# Cache en memoria RAM (ConcurrentHashMap)
spring.cache.type=simple
spring.cache.cache-names=mashup

# Documentacion OpenAPI y Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# API externa The Movie Database (TMDB). La clave se lee de la variable de entorno TMDB_API_KEY
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-url=https://image.tmdb.org/t/p/w500
tmdb.api-key=${TMDB_API_KEY:}

# OpenAI con LangChain4j. La clave se lee de la variable de entorno OPENAI_API_KEY
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:sin-clave}
langchain4j.open-ai.chat-model.model-name=gpt-4.1-mini
logging.level.dev.langchain4j.service.ToolErrorHandlingNotice=OFF
