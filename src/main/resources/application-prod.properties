# Perfil PROD: base de datos H2 persistida en disco (carpeta ./data/)
spring.datasource.url=jdbc:h2:file:./data/applyfilms_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# validate: Hibernate solo comprueba que las tablas coinciden con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Consola H2 deshabilitada por seguridad
spring.h2.console.enabled=false

# Script que crea las tablas la primera vez (si no existen)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-prod.sql
