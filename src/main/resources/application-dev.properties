#application-dev.properties
server.port=8090

# Spring Data JPA
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/applyfilms_db
spring.datasource.username=dev_nico
spring.datasource.password=secret1234

# Nombre de nuestra aplicación.
spring.application.name=Apply FILMS - Entorno Desarrollador
# Leemos la clave desde la variable de entorno.
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
# Conservamos el modelo con el que ya funciona la aplicación.
langchain4j.open-ai.chat-model.model-name=gpt-6-luna
# Mostramos las peticiones que enviamos al modelo.
langchain4j.open-ai.chat-model.log-requests=true
# Mostramos las respuestas que recibimos del modelo.
langchain4j.open-ai.chat-model.log-responses=true
# Permitimos que la consola muestre los mensajes DEBUG de LangChain4j.
logging.level.dev.langchain4j=DEBUG
