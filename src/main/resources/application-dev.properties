# Puerto de la aplicación
server.port=8090

# Ruta base de la API
server.servlet.context-path=/applyfilms/api

# Spring Data JPA - PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/applyfilms_db
spring.datasource.username=dev_nico
spring.datasource.password=${DB_PASSWORD}

# Crear o actualizar las tablas mediante JPA
spring.jpa.hibernate.ddl-auto=update

# Esperar a que Hibernate prepare las tablas
spring.jpa.defer-datasource-initialization=true

# Ejecutar los scripts SQL en PostgreSQL
spring.sql.init.mode=always

# Nombre de la aplicación
spring.application.name=Apply FILMS - Entorno Desarrollador

# Configuración de OpenAI
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=${OPENAI_MODEL}

# Registro de peticiones y respuestas
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

# Logs de LangChain4j
logging.level.dev.langchain4j=DEBUG

