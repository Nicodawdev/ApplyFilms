# Perfil TEST: base de datos H2 en memoria aislada para los tests
spring.datasource.url=jdbc:h2:mem:applyfilms_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# En los tests no se llama a servicios externos reales
tmdb.api-key=
langchain4j.open-ai.chat-model.api-key=clave-de-test
